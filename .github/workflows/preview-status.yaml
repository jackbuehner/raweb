name: Preview Status

on:
  workflow_run:
    workflows: ["Preview Frontend", "Preview Backend"]
    types: [requested, completed]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: preview-status-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  update-description:
    name: Update PR description
    runs-on: ubuntu-latest
    if: >-
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push') &&
      !(github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository) &&
      !(github.event.action == 'completed' && github.event.workflow_run.conclusion == 'cancelled')

    steps:
      - name: Resolve pull request number
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number="${{ github.event.workflow_run.pull_requests[0].number }}"

          if [ -z "$number" ]; then
            for attempt in 1 2 3 4 5; do
              number=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/pulls" \
                --jq '[.[] | select(.state == "open")][0].number')
              if [ -n "$number" ] && [ "$number" != "null" ]; then
                break
              fi
              sleep 5
            done
          fi

          if [ -z "$number" ] || [ "$number" = "null" ]; then
            echo "Could not resolve a pull request for this workflow_run; skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Determine context
        if: steps.pr.outputs.found == 'true'
        id: context
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$WORKFLOW_NAME" = "Preview Backend" ]; then
            echo "is_backend=true" >> "$GITHUB_OUTPUT"
            echo "is_frontend=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_backend=false" >> "$GITHUB_OUTPUT"
            echo "is_frontend=true" >> "$GITHUB_OUTPUT"
          fi

          trusted="false"
          if [ "$HEAD_OWNER" = "kimmknight" ] || [ "$HEAD_OWNER" = "jackbuehner" ]; then
            trusted="true"
          fi

          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"
          echo "head_owner=$HEAD_OWNER" >> "$GITHUB_OUTPUT"
          echo "head_repo=$HEAD_REPO" >> "$GITHUB_OUTPUT"
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check for a newer run
        if: steps.pr.outputs.found == 'true'
        id: freshness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          workflow_file=$(basename "$WORKFLOW_PATH")
          latest_id=$(gh api "repos/${{ github.repository }}/actions/workflows/${workflow_file}/runs?branch=${HEAD_BRANCH}&event=${RUN_EVENT}&per_page=1" \
            --jq '.workflow_runs[0].id // empty')

          if [ -n "$latest_id" ] && [ "$latest_id" != "$CURRENT_RUN_ID" ]; then
            echo "A newer run ($latest_id) exists for $WORKFLOW_PATH on $HEAD_BRANCH; this run ($CURRENT_RUN_ID) is stale, skipping."
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine backend job conclusions
        if: >-
          steps.pr.outputs.found == 'true' &&
          steps.freshness.outputs.is_latest == 'true' &&
          github.event.action == 'completed' &&
          steps.context.outputs.is_backend == 'true'
        id: backend_jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jobs=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" --jq '.jobs')

          server=$(echo "$jobs" | jq -r '.[] | select(.name == "Build server (backend)") | .conclusion')
          desktop=$(echo "$jobs" | jq -r '.[] | select(.name == "Build desktop app (Windows)") | .conclusion')

          echo "server_conclusion=${server:-unknown}" >> "$GITHUB_OUTPUT"
          echo "desktop_conclusion=${desktop:-unknown}" >> "$GITHUB_OUTPUT"

          if [ "$desktop" = "success" ]; then
            artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
              --jq '[.artifacts[] | select((.name | startswith("Installer for RemoteApps & Devices")) and .expired == false)][0].id // empty')
            if [ -n "$artifact_id" ]; then
              echo "artifact_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts/${artifact_id}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check fork's own GitHub Pages status
        id: fork_pages
        if: >-
          steps.pr.outputs.found == 'true' &&
          steps.freshness.outputs.is_latest == 'true' &&
          github.event.action == 'completed' &&
          steps.context.outputs.is_frontend == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          steps.context.outputs.trusted == 'false'
        run: |
          owner="${{ steps.context.outputs.head_owner }}"
          repo="${{ steps.context.outputs.head_repo }}"

          status=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/${owner}/${repo}/pages")

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "url=https://${owner}.github.io/${repo}/" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PR description
        if: steps.pr.outputs.found == 'true' && steps.freshness.outputs.is_latest == 'true'
        uses: actions/github-script@v8
        env:
          EVENT_ACTION: ${{ github.event.action }}
          IS_BACKEND: ${{ steps.context.outputs.is_backend }}
          IS_FRONTEND: ${{ steps.context.outputs.is_frontend }}
          TRUSTED: ${{ steps.context.outputs.trusted }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SERVER_CONCLUSION: ${{ steps.backend_jobs.outputs.server_conclusion }}
          DESKTOP_CONCLUSION: ${{ steps.backend_jobs.outputs.desktop_conclusion }}
          DESKTOP_ARTIFACT_URL: ${{ steps.backend_jobs.outputs.artifact_url }}
          HEAD_OWNER: ${{ steps.context.outputs.head_owner }}
          HEAD_REPO: ${{ steps.context.outputs.head_repo }}
          HEAD_BRANCH: ${{ steps.context.outputs.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          FORK_PAGES_ENABLED: ${{ steps.fork_pages.outputs.enabled }}
          FORK_PAGES_URL: ${{ steps.fork_pages.outputs.url }}
          DOCS_URL: https://raweb.app/docs/pr-previews/
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const marker = "<!-- DEPLOY-PREVIEW-COMMENT -->";
            const endMarker = "<!-- /DEPLOY-PREVIEW-COMMENT -->";
            const {
              EVENT_ACTION, IS_BACKEND, IS_FRONTEND, TRUSTED, CONCLUSION,
              SERVER_CONCLUSION, DESKTOP_CONCLUSION, DESKTOP_ARTIFACT_URL,
              HEAD_OWNER, HEAD_REPO, HEAD_BRANCH, DEFAULT_BRANCH, RUN_URL,
              FORK_PAGES_ENABLED, FORK_PAGES_URL, DOCS_URL,
            } = process.env;
            const trusted = TRUSTED === "true";

            const btn = (label, href, disabled) => {
              const base = disabled ? `${label}-disabled` : label;
              const picture = `<picture>` +
                `<source media="(prefers-color-scheme: dark)" srcset="https://install.raweb.app/buttons/${base}-dark.svg">` +
                `<source media="(prefers-color-scheme: light)" srcset="https://install.raweb.app/buttons/${base}-light.svg">` +
                `<img src="https://install.raweb.app/buttons/${base}-light.svg" alt="${label}" height="32">` +
                `</picture>`;
              return disabled ? picture : `<a href="${href}" rel="nofollow">${picture}</a>`;
            };

            const logsLink = (url) => (url ? btn("view-logs", url, false) : "");

            function serverSection() {
              if (!trusted) {
                return {
                  status: "Not available for builds from outside contributors",
                  button: "",
                };
              }

              const installUrl = `https://install.raweb.app/preview/${HEAD_OWNER}/${HEAD_BRANCH}`;

              if (EVENT_ACTION === "requested") {
                return {
                  status: "Building",
                  button: btn("install-this-developer-build-from-source-primary", `${installUrl}?source=force`, false),
                };
              }

              if (SERVER_CONCLUSION === "success") {
                return {
                  status: "Success",
                  button: btn("install-this-developer-build-primary", installUrl, false),
                };
              }

              return {
                status: "Build failed",
                button: btn("install-this-developer-build-from-source-primary", `${installUrl}?source=force`, false),
              };
            }

            function desktopSection() {
              if (EVENT_ACTION === "requested") {
                return { status: "Building", button: btn("install-this-developer-build", "#", true) };
              }

              if (DESKTOP_CONCLUSION === "success" && DESKTOP_ARTIFACT_URL) {
                return { status: "Success", button: btn("install-this-developer-build", DESKTOP_ARTIFACT_URL, false) };
              }

              return {
                status: DESKTOP_CONCLUSION === "success" ? "Success" : "Build failed",
                button: btn("install-this-developer-build", "#", true),
              };
            }

            function webappSection() {
              if (EVENT_ACTION === "requested") {
                return {
                  status: "Building",
                  button: btn("view-preview-in-browser", "#", true),
                };
              }

              if (CONCLUSION !== "success") {
                return {
                  status: "Build or deployment failed",
                  button: btn("view-preview-in-browser", "#", true),
                };
              }

              if (trusted) {
                const url = HEAD_BRANCH === DEFAULT_BRANCH
                  ? `https://${HEAD_OWNER}.github.io/${HEAD_REPO}/`
                  : `https://${HEAD_OWNER}.github.io/${HEAD_REPO}/deploy-preview/${HEAD_BRANCH}/`;
                return {
                  status: "Deployed",
                  button: btn("view-preview-in-browser", url, false),
                };
              }

              if (FORK_PAGES_ENABLED === "true") {
                return {
                  status: "Deployed",
                  button: btn("view-preview-in-browser", FORK_PAGES_URL, false),
                };
              }

              return {
                status: `Error: GitHub Pages is not enabled on your fork. [Instructions](${DOCS_URL})`,
                button: btn("view-preview-in-browser", "#", true),
              };
            }

            function renderBody({ server, webapp, desktop }) {
              return `<!-- DO NOT EDIT CONTENT AFTER THIS LINE -->${marker}
            <div width="100%">
            <table width="100%">
              <thead>
                <tr>
                  <th colspan="3" align="left" valign="middle">Deployment status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td valign="middle">RAWeb (server)</td>
                  <td valign="middle"><!--STATUS:SERVER-->${server.status}<!--/STATUS:SERVER--></td>
                  <td align="right" valign="middle">
                    <!--BUTTON:SERVER-->${server.button}<!--/BUTTON:SERVER-->
                    <!--LOGS:SERVER-->${server.logs}<!--/LOGS:SERVER-->
                  </td>
                </tr>
                <tr>
                  <td valign="middle">RemoteApps &amp; Devices (web app)</td>
                  <td valign="middle"><!--STATUS:WEBAPP-->${webapp.status}<!--/STATUS:WEBAPP--></td>
                  <td align="right" valign="middle">
                    <!--BUTTON:WEBAPP-->${webapp.button}<!--/BUTTON:WEBAPP-->
                    <!--LOGS:WEBAPP-->${webapp.logs}<!--/LOGS:WEBAPP-->
                  </td>
                </tr>
                <tr>
                  <td valign="middle">RemoteApps &amp; Devices (desktop app)</td>
                  <td valign="middle"><!--STATUS:DESKTOP-->${desktop.status}<!--/STATUS:DESKTOP--></td>
                  <td align="right" valign="middle">
                    <!--BUTTON:DESKTOP-->${desktop.button}<!--/BUTTON:DESKTOP-->
                    <!--LOGS:DESKTOP-->${desktop.logs}<!--/LOGS:DESKTOP-->
                  </td>
                </tr>
              </tbody>
            </table>
            </div>
            ${endMarker}`;
            }

            function extract(body, tag, fallback) {
              const re = new RegExp(`<!--${tag}-->([\\s\\S]*?)<!--/${tag}-->`);
              const match = body && body.match(re);
              return match ? match[1] : fallback;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const currentBody = pr.body || "";
            const hasTable = currentBody.includes(marker) && currentBody.includes(endMarker);
            const blockRe = new RegExp(`${marker}[\\s\\S]*?${endMarker}`);
            const restOfBody = hasTable
              ? currentBody.replace(blockRe, "").replace(/\s+$/, "").replace(/^\s+/, "")
              : currentBody;

            const defaults = {
              server: { status: "Building...", button: "", logs: "" },
              webapp: { status: "Building...", button: "", logs: "" },
              desktop: { status: "Building...", button: "", logs: "" },
            };
            if (hasTable) {
              defaults.server.status = extract(currentBody, "STATUS:SERVER", defaults.server.status);
              defaults.server.button = extract(currentBody, "BUTTON:SERVER", defaults.server.button);
              defaults.server.logs = extract(currentBody, "LOGS:SERVER", defaults.server.logs);
              defaults.webapp.status = extract(currentBody, "STATUS:WEBAPP", defaults.webapp.status);
              defaults.webapp.button = extract(currentBody, "BUTTON:WEBAPP", defaults.webapp.button);
              defaults.webapp.logs = extract(currentBody, "LOGS:WEBAPP", defaults.webapp.logs);
              defaults.desktop.status = extract(currentBody, "STATUS:DESKTOP", defaults.desktop.status);
              defaults.desktop.button = extract(currentBody, "BUTTON:DESKTOP", defaults.desktop.button);
              defaults.desktop.logs = extract(currentBody, "LOGS:DESKTOP", defaults.desktop.logs);
            }

            const sections = { ...defaults };
            if (IS_BACKEND === "true") {
              sections.server = { ...serverSection(), logs: logsLink(RUN_URL) };
              sections.desktop = { ...desktopSection(), logs: logsLink(RUN_URL) };
            } else if (IS_FRONTEND === "true") {
              sections.webapp = { ...webappSection(), logs: logsLink(RUN_URL) };
            }

            const table = renderBody(sections);
            const newBody = restOfBody ? `${restOfBody}\n\n${table}` : table;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: newBody,
            });
